name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rag-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core deps (offline-friendly)
        run: |
          pip install --upgrade pip
          pip install chromadb fastapi pypdf rank-bm25 numpy pytest httpx
      - name: Run RAG smoke test
        run: pytest tests/ -q
